<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>自動報告ツール</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    body { font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif; }
    .todo-card { background: #fff7ed; }
    .shimmer {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    /* フォーカスリング（アクセシビリティ対応） */
    button:focus-visible { outline: 2px solid #f97316; outline-offset: 2px; }
    input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 2px solid #f97316; outline-offset: 0;
    }
    input, textarea, select { outline: none; }

    /* コピートースト */
    .copy-toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #1f2937; color: white; padding: 10px 20px; border-radius: 9999px;
      font-size: 14px; z-index: 9999; opacity: 0; transition: opacity 0.3s;
      pointer-events: none; white-space: nowrap;
    }
    .copy-toast.show { opacity: 1; }

    /* マイクボタン */
    .mic-btn { transition: all 0.2s; -webkit-tap-highlight-color: transparent; }
    .mic-btn.recording {
      animation: mic-pulse 1.2s ease-in-out infinite;
      background-color: #ef4444 !important;
      border-color: #fca5a5 !important;
    }
    @keyframes mic-pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); }
      50%      { box-shadow: 0 0 0 12px rgba(239,68,68,0); }
    }

    /* 音声波形 */
    .voice-wave { display:flex; align-items:center; gap:3px; height:20px; }
    .voice-wave span {
      display:inline-block; width:3px; background:#ef4444;
      border-radius:9999px; animation:wave 0.8s ease-in-out infinite;
    }
    .voice-wave span:nth-child(1){animation-delay:0s;   height:8px}
    .voice-wave span:nth-child(2){animation-delay:0.1s; height:16px}
    .voice-wave span:nth-child(3){animation-delay:0.2s; height:12px}
    .voice-wave span:nth-child(4){animation-delay:0.3s; height:18px}
    .voice-wave span:nth-child(5){animation-delay:0.4s; height:10px}
    @keyframes wave {
      0%,100% { transform:scaleY(0.5); }
      50%      { transform:scaleY(1.2); }
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <div class="max-w-xl mx-auto px-4 py-6 space-y-4">

    <!-- ヘッダー -->
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-orange-100 rounded-xl flex items-center justify-center flex-shrink-0">
        <i data-lucide="clipboard-list" class="text-orange-500" style="width:22px;height:22px"></i>
      </div>
      <div class="flex-1 min-w-0">
        <h1 class="text-xl font-bold text-gray-900">自動報告ツール</h1>
        <p class="text-xs text-gray-400">話すだけでToDoと報告文を自動生成</p>
      </div>
      <!-- タップ領域 44px確保 -->
      <button id="settingsBtn" aria-label="設定を開く"
        class="w-11 h-11 rounded-xl bg-white border border-gray-200 flex items-center justify-center active:bg-gray-100 transition-colors flex-shrink-0">
        <i data-lucide="settings" class="text-gray-400" style="width:20px;height:20px"></i>
      </button>
    </div>

    <!-- ① 初回オンボーディング（APIキー未設定時） -->
    <div id="onboardingBanner" class="hidden bg-orange-50 border border-orange-200 rounded-2xl p-4">
      <div class="flex items-start gap-3">
        <div class="w-8 h-8 bg-orange-500 rounded-lg flex items-center justify-center flex-shrink-0">
          <i data-lucide="key" class="text-white" style="width:16px;height:16px"></i>
        </div>
        <div class="flex-1">
          <p class="text-sm font-bold text-orange-800 mb-1">はじめに設定が必要です</p>
          <p class="text-xs text-orange-700 mb-3">Gemini API\u30AD\u30FCを設定すると報告文が生成されます。</p>
          <button id="onboardingSetupBtn"
            class="w-full py-2.5 bg-orange-500 text-white text-sm font-semibold rounded-xl active:bg-orange-600 transition-colors">
            設定する（30秒）
          </button>
        </div>
      </div>
    </div>

    <!-- 設定パネル -->
    <div id="settingsPanel" class="hidden bg-white rounded-2xl border border-gray-200 p-4 space-y-3">
      <p class="text-sm font-semibold text-gray-700 flex items-center gap-2">
        <i data-lucide="key" style="width:15px;height:15px"></i> API設定
      </p>
      <div>
        <label for="apiKey" class="text-xs text-gray-500 mb-1.5 block">Gemini API\u30AD\u30FC</label>
        <input id="apiKey" type="password" placeholder="AIza..."
          class="w-full text-sm border border-gray-200 rounded-xl px-3 py-3 bg-gray-50 focus:bg-white focus:border-orange-300 transition-colors" />
        <p class="text-xs text-gray-400 mt-1.5"><a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" class="text-orange-500 underline">aistudio.google.com</a> で無料取得できます。キーはこの端末内のみ保存。</p>
      </div>
      <div>
        <label for="modelSelect" class="text-xs text-gray-500 mb-1.5 block">モデル</label>
        <select id="modelSelect" class="w-full text-sm border border-gray-200 rounded-xl px-3 py-3 bg-gray-50">
          <option value="gemini-2.5-flash">Gemini 2.5 Flash（推奨・無料枠あり）</option>
          <option value="gemini-2.0-flash">Gemini 2.0 Flash（高速）</option>
        </select>
      </div>
      <button id="saveSettings"
        class="w-full py-3 bg-orange-500 text-white text-sm font-semibold rounded-xl active:bg-orange-600 transition-colors">
        保存する
      </button>
    </div>

    <!-- ② 音声入力エリア -->
    <div class="bg-white rounded-2xl border border-gray-200 p-5 space-y-4">

      <!-- LINEブラウザ警告 -->
      <div id="lineWarning" class="hidden bg-blue-50 border border-blue-200 rounded-xl px-3 py-3">
        <p class="text-xs text-blue-800 font-semibold mb-1">LINEアプリ内で開いています</p>
        <p class="text-xs text-blue-700 mb-2.5">音声入力はSafari（iPhone）またはChrome（Android）で使えます。</p>
        <button id="openExternalBtn"
          class="w-full py-2.5 bg-blue-500 text-white text-sm font-semibold rounded-xl active:bg-blue-600 transition-colors flex items-center justify-center gap-2">
          <i data-lucide="external-link" style="width:15px;height:15px"></i>
          <span id="openExternalLabel">外部ブラウザで開く</span>
        </button>
      </div>

      <!-- 音声非対応警告 -->
      <div id="noSpeechWarning" class="hidden bg-amber-50 border border-amber-200 rounded-xl px-3 py-3 flex items-start gap-2">
        <i data-lucide="alert-triangle" class="text-amber-500 flex-shrink-0 mt-0.5" style="width:16px;height:16px"></i>
        <p class="text-xs text-amber-700">このブラウザは音声入力に対応していません。<br>テキスト入力からご利用ください。</p>
      </div>

      <!-- マイクボタン -->
      <div class="flex flex-col items-center gap-3 py-2">
        <button id="micBtn" aria-label="音声入力を開始"
          class="mic-btn w-20 h-20 rounded-full bg-orange-500 text-white flex items-center justify-center border-4 border-orange-100">
          <i data-lucide="mic" style="width:32px;height:32px"></i>
        </button>
        <div id="micStatus">
          <p class="text-sm text-gray-500">タップして話す</p>
        </div>
        <div id="voiceWave" class="voice-wave hidden" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <div class="flex-1 h-px bg-gray-100"></div>
        <span class="text-xs text-gray-300">または</span>
        <div class="flex-1 h-px bg-gray-100"></div>
      </div>

      <!-- テキスト入力（補助） -->
      <div>
        <label for="inputText" class="text-xs text-gray-400 mb-2 flex items-center gap-1.5">
          <i data-lucide="pencil" style="width:12px;height:12px"></i> テキストで入力
        </label>
        <textarea id="inputText" rows="4"
          placeholder="例：田中様の入浴介助は14時まで。佐藤様に夕薬を17時に投与。夜勤前に記録を必ず入力。"
          class="w-full text-base text-gray-800 border border-gray-100 rounded-xl px-3 py-3 bg-gray-50 focus:bg-white focus:border-orange-300 resize-none transition-colors leading-relaxed">
        </textarea>
        <div class="flex items-center justify-between mt-2">
          <span class="text-xs text-gray-400" id="charCount">0 文字</span>
          <!-- タップ領域 44px確保 -->
          <button id="clearBtn" aria-label="入力内容をクリア"
            class="h-11 px-3 text-xs text-gray-400 active:text-gray-700 flex items-center gap-1 transition-colors">
            <i data-lucide="x" style="width:13px;height:13px"></i> クリア
          </button>
        </div>
      </div>
    </div>

    <!-- ③ 生成ボタン -->
    <button id="generateBtn"
      class="w-full py-4 bg-orange-500 text-white text-lg font-bold rounded-2xl flex items-center justify-center gap-3 disabled:opacity-40 disabled:cursor-not-allowed active:bg-orange-600 transition-colors"
      style="letter-spacing:0.03em;">
      <i data-lucide="zap" style="width:22px;height:22px"></i>
      <span id="btnLabel">生成する</span>
    </button>

    <!-- ローディング（スケルトン） -->
    <div id="loadingArea" class="hidden space-y-4">
      <div class="todo-card rounded-2xl border-2 border-orange-100 p-4 space-y-3">
        <div class="h-5 shimmer rounded-lg w-2/3"></div>
        <div class="h-4 shimmer rounded-lg w-full"></div>
        <div class="h-4 shimmer rounded-lg w-4/5"></div>
        <div class="h-4 shimmer rounded-lg w-3/4"></div>
      </div>
      <div class="bg-white rounded-2xl border border-gray-200 p-4 space-y-3">
        <div class="h-5 shimmer rounded-lg w-1/2"></div>
        <div class="h-4 shimmer rounded-lg w-full"></div>
        <div class="h-4 shimmer rounded-lg w-full"></div>
        <div class="h-4 shimmer rounded-lg w-5/6"></div>
        <div class="h-4 shimmer rounded-lg w-4/5"></div>
      </div>
    </div>

    <!-- 生成結果エリア -->
    <div id="resultArea" class="hidden space-y-4">

      <!-- ToDo カード -->
      <div class="todo-card rounded-2xl border-2 border-orange-200 p-4 space-y-3">
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 bg-orange-500 rounded-lg flex items-center justify-center flex-shrink-0">
            <i data-lucide="alert-circle" class="text-white" style="width:16px;height:16px"></i>
          </div>
          <span class="font-bold text-orange-700 text-base">本日中の重要ToDo</span>
          <span class="ml-auto text-xs bg-red-100 text-red-600 font-bold px-2 py-1 rounded-full">要対応</span>
        </div>
        <div id="todoContent" class="space-y-2.5"></div>
        <button onclick="copyText('todo')"
          class="w-full py-2 bg-orange-50 text-orange-600 text-xs font-medium rounded-xl flex items-center justify-center gap-1.5 active:bg-orange-100 transition-colors border border-orange-100">
          <i data-lucide="copy" style="width:13px;height:13px"></i> ToDoをコピー
        </button>
      </div>

      <!-- 完成文カード -->
      <div class="bg-white rounded-2xl border border-gray-200 p-4 space-y-3">
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 bg-blue-500 rounded-lg flex items-center justify-center flex-shrink-0">
            <i data-lucide="message-square" class="text-white" style="width:16px;height:16px"></i>
          </div>
          <span class="font-bold text-gray-800 text-base">職員向け完成文</span>
        </div>
        <div id="messageContent"
          class="text-sm text-gray-700 bg-gray-50 rounded-xl p-3 leading-relaxed whitespace-pre-wrap min-h-24 border border-gray-100">
        </div>
        <button onclick="copyText('message')"
          class="w-full py-2 bg-gray-50 text-gray-500 text-xs font-medium rounded-xl flex items-center justify-center gap-1.5 active:bg-gray-100 transition-colors border border-gray-200">
          <i data-lucide="copy" style="width:13px;height:13px"></i> 完成文をコピー
        </button>
      </div>

      <!-- メインCTA: LINEで全部送る -->
      <button onclick="shareToLine('all')"
        class="w-full py-4 rounded-2xl text-white font-bold text-base flex items-center justify-center gap-2.5 active:opacity-90 transition-opacity shadow-md"
        style="background:#06C755;">
        <svg style="width:22px;height:22px;flex-shrink:0" viewBox="0 0 48 48" fill="white"><path d="M24 4C12.95 4 4 11.86 4 21.5c0 6.02 3.58 11.34 9.02 14.68-.4 1.48-1.44 5.38-1.65 6.2-.27 1.03.37 1.02.77.74.32-.22 5.11-3.44 7.17-4.83.85.12 1.73.18 2.69.18 11.05 0 20-7.86 20-17.5C44 11.86 35.05 4 24 4z"/></svg>
        LINEで全部送る（ToDo＋完成文）
      </button>

      <!-- サブ: 個別LINE送信 + 全コピー -->
      <div class="flex gap-2">
        <button onclick="shareToLine('todo')"
          class="flex-1 py-2.5 rounded-xl text-sm font-medium flex items-center justify-center gap-1.5 active:opacity-80 transition-opacity border border-green-500 text-green-600 bg-white">
          <svg style="width:14px;height:14px;flex-shrink:0" viewBox="0 0 48 48" fill="#16a34a"><path d="M24 4C12.95 4 4 11.86 4 21.5c0 6.02 3.58 11.34 9.02 14.68-.4 1.48-1.44 5.38-1.65 6.2-.27 1.03.37 1.02.77.74.32-.22 5.11-3.44 7.17-4.83.85.12 1.73.18 2.69.18 11.05 0 20-7.86 20-17.5C44 11.86 35.05 4 24 4z"/></svg>
          ToDoのみ
        </button>
        <button onclick="shareToLine('message')"
          class="flex-1 py-2.5 rounded-xl text-sm font-medium flex items-center justify-center gap-1.5 active:opacity-80 transition-opacity border border-green-500 text-green-600 bg-white">
          <svg style="width:14px;height:14px;flex-shrink:0" viewBox="0 0 48 48" fill="#16a34a"><path d="M24 4C12.95 4 4 11.86 4 21.5c0 6.02 3.58 11.34 9.02 14.68-.4 1.48-1.44 5.38-1.65 6.2-.27 1.03.37 1.02.77.74.32-.22 5.11-3.44 7.17-4.83.85.12 1.73.18 2.69.18 11.05 0 20-7.86 20-17.5C44 11.86 35.05 4 24 4z"/></svg>
          完成文のみ
        </button>
        <button onclick="copyText('all')"
          class="flex-1 py-2.5 bg-gray-100 text-gray-600 rounded-xl text-sm font-medium flex items-center justify-center gap-1.5 active:bg-gray-200 transition-colors">
          <i data-lucide="copy" style="width:13px;height:13px"></i> 全コピー
        </button>
      </div>

    </div>

    <p class="text-center text-xs text-gray-300 pb-4">自動報告ツール v2.2</p>
  </div>

  <!-- コピートースト -->
  <div id="copyToast" class="copy-toast" role="status" aria-live="polite"></div>

  <script>
    lucide.createIcons();

    // ---- 設定の読み込み ----
    const getApiKey = () => document.getElementById('apiKey').value.trim() || localStorage.getItem('reportToolApiKey') || '';
    const getModel  = () => document.getElementById('modelSelect').value || localStorage.getItem('reportToolModel') || 'gemini-2.5-flash';

    const savedKey = localStorage.getItem('reportToolApiKey');
    if (savedKey) document.getElementById('apiKey').value = savedKey;
    const savedModel = localStorage.getItem('reportToolModel');
    if (savedModel) document.getElementById('modelSelect').value = savedModel;

    // APIキー未設定時のオンボーディングバナー
    if (!savedKey) {
      document.getElementById('onboardingBanner').classList.remove('hidden');
    }

    document.getElementById('settingsBtn').addEventListener('click', () => {
      document.getElementById('settingsPanel').classList.toggle('hidden');
      document.getElementById('onboardingBanner').classList.add('hidden');
    });
    document.getElementById('onboardingSetupBtn')?.addEventListener('click', () => {
      document.getElementById('onboardingBanner').classList.add('hidden');
      document.getElementById('settingsPanel').classList.remove('hidden');
    });
    document.getElementById('saveSettings').addEventListener('click', () => {
      const key = document.getElementById('apiKey').value.trim();
      localStorage.setItem('reportToolApiKey', key);
      localStorage.setItem('reportToolModel', document.getElementById('modelSelect').value);
      document.getElementById('settingsPanel').classList.add('hidden');
      document.getElementById('onboardingBanner').classList.add('hidden');
      showToast('設定を保存しました');
    });

    // ---- テキスト入力 ----
    document.getElementById('inputText').addEventListener('input', function () {
      document.getElementById('charCount').textContent = this.value.length + ' 文字';
    });
    document.getElementById('clearBtn').addEventListener('click', () => {
      document.getElementById('inputText').value = '';
      document.getElementById('charCount').textContent = '0 文字';
      document.getElementById('resultArea').classList.add('hidden');
      document.getElementById('micStatus').innerHTML = '<p class="text-sm text-gray-500">タップして話す</p>';
    });

    // ---- 環境検出 ----
    const ua = navigator.userAgent;
    const isLineApp = /Line\//i.test(ua);
    const isIOS     = /iPhone|iPad|iPod/i.test(ua);
    const isAndroid = /Android/i.test(ua);

    // LINEブラウザ検出 → 外部ブラウザ誘導
    if (isLineApp) {
      document.getElementById('lineWarning').classList.remove('hidden');
      const label = document.getElementById('openExternalLabel');
      if (isIOS) label.textContent = 'Safariで開く';
      else label.textContent = 'Chromeで開く';

      document.getElementById('openExternalBtn').addEventListener('click', () => {
        const currentUrl = location.href;
        if (isIOS) {
          // iOSのLINEブラウザ：URLの末尾に特殊パラメータ付与でSafariに渡す
          const sep = currentUrl.includes('?') ? '&' : '?';
          location.href = currentUrl + sep + 'openInSafari=1';
        } else {
          // Android：クリップボードにURLコピー → 案内
          if (navigator.clipboard) {
            navigator.clipboard.writeText(currentUrl).then(() => {
              showToast('URLをコピーしました。Chromeで開いてください');
            }).catch(() => showToast('URLをコピーしてChromeで開いてください：' + currentUrl));
          } else {
            showToast('このURLをChromeで開いてください');
          }
        }
      });
    }

    // ---- 音声入力 ----
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isRecording  = false;
    let manualStop   = false; // 手動停止フラグ（onend後の自動生成を防ぐ）

    if (!SpeechRecognition) {
      document.getElementById('noSpeechWarning').classList.remove('hidden');
      const micBtn = document.getElementById('micBtn');
      micBtn.disabled = true;
      micBtn.setAttribute('aria-disabled', 'true');
      micBtn.classList.add('opacity-40', 'cursor-not-allowed');
    } else {
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = false;
      recognition.interimResults = true;

      recognition.onstart = () => {
        isRecording = true;
        manualStop = false;
        const btn = document.getElementById('micBtn');
        btn.classList.add('recording');
        btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>';
        document.getElementById('micStatus').innerHTML = '<p class="text-sm text-red-500 font-semibold">録音中… 話してください</p>';
        document.getElementById('voiceWave').classList.remove('hidden');
      };

      recognition.onresult = (event) => {
        let interimText = '';
        let finalText = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const t = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalText += t;
          else interimText += t;
        }
        const display = finalText || interimText;
        document.getElementById('inputText').value = display;
        document.getElementById('charCount').textContent = display.length + ' 文字';
        document.getElementById('micStatus').innerHTML =
          `<p class="text-xs text-gray-500 text-center px-2">${escapeHtml(display.slice(0, 30))}${display.length > 30 ? '…' : ''}</p>`;
      };

      recognition.onend = () => {
        isRecording = false;
        resetMicBtn();
        const text = document.getElementById('inputText').value.trim();
        if (text && !manualStop) {
          document.getElementById('micStatus').innerHTML =
            '<p class="text-sm text-green-600 font-semibold">認識完了 — 生成中...</p>';
          setTimeout(generateReport, 400);
        } else {
          document.getElementById('micStatus').innerHTML =
            '<p class="text-sm text-gray-500">タップして話す</p>';
        }
      };

      recognition.onerror = (event) => {
        isRecording = false;
        manualStop = false;
        resetMicBtn();
        const msgs = {
          'no-speech':   '音声が認識されませんでした。もう一度話してください',
          'not-allowed': 'マイクの使用を許可してください',
          'network':     'ネットワークエラーが発生しました',
          'aborted':     '録音がキャンセルされました',
        };
        showToast(msgs[event.error] || '音声認識エラーが発生しました');
        document.getElementById('micStatus').innerHTML =
          '<p class="text-sm text-gray-500">タップして話す</p>';
        document.getElementById('voiceWave').classList.add('hidden');
      };
    }

    function resetMicBtn() {
      const btn = document.getElementById('micBtn');
      btn.classList.remove('recording');
      btn.innerHTML = '<i data-lucide="mic" style="width:32px;height:32px"></i>';
      lucide.createIcons({ nodes: [btn] });
      document.getElementById('voiceWave').classList.add('hidden');
    }

    document.getElementById('micBtn').addEventListener('click', () => {
      if (!recognition) return;
      if (isRecording) {
        manualStop = true;
        recognition.stop();
      } else {
        document.getElementById('inputText').value = '';
        document.getElementById('charCount').textContent = '0 文字';
        document.getElementById('resultArea').classList.add('hidden');
        try {
          recognition.start();
        } catch (e) {
          showToast('マイクを起動できませんでした。もう一度タップしてください');
        }
      }
    });

    // ---- 生成ボタン ----
    document.getElementById('generateBtn').addEventListener('click', generateReport);

    // ---- 生成データ ----
    let generatedTodo    = '';
    let generatedMessage = '';

    async function generateReport() {
      const input  = document.getElementById('inputText').value.trim();
      if (!input) { showToast('指示内容を入力してください'); return; }

      const apiKey = getApiKey();
      if (!apiKey) {
        document.getElementById('onboardingBanner').classList.remove('hidden');
        document.getElementById('settingsPanel').classList.remove('hidden');
        showToast('APIキーを設定してください');
        return;
      }

      setLoading(true);

      const systemPrompt = `あなたは介護施設の管理者が使う報告文生成AIです。
管理者が入力した指示・業務内容をもとに、以下を生成してください。

返答は必ず以下のJSON形式のみで返してください（コードブロック不要）：
{
  "todo": {
    "deadline": "本日17:00まで など",
    "targets": ["田中様", "佐藤様"],
    "actions": [
      {"label": "入浴介助", "person": "田中様", "time": "14:00"},
      {"label": "夕薬投与", "person": "佐藤様", "time": "17:00"}
    ]
  },
  "message": "職員の皆様へ送る完成した連絡文（敬語・丁寧語・改行あり）"
}

ルール:
- ToDoは本日中に絶対やるべき最重要事項のみ（最大5件）
- 完成文の末尾は「よろしくお願いします。」
- 日本語で出力`;

      try {
        const model = getModel();
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: systemPrompt }] },
            contents: [{ role: 'user', parts: [{ text: input }] }],
            generationConfig: { temperature: 0.3, maxOutputTokens: 1200, responseMimeType: 'application/json' }
          })
        });

        if (!res.ok) {
          const errBody = await res.json().catch(() => ({}));
          throw new Error(errBody.error?.message || `APIエラー ${res.status}`);
        }

        const data = await res.json();
        const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!raw) throw new Error('レスポンスが空です');

        let parsed;
        try {
          parsed = JSON.parse(raw);
        } catch {
          throw new Error('AIの返答を解析できませんでした。もう一度お試しください');
        }

        if (!parsed.todo || !parsed.message) throw new Error('生成結果が不完全です。もう一度お試しください');

        renderResult(parsed);
        document.getElementById('micStatus').innerHTML =
          '<p class="text-sm text-gray-500">タップして話す</p>';

      } catch (e) {
        setLoading(false);
        document.getElementById('micStatus').innerHTML =
          '<p class="text-sm text-gray-500">タップして話す</p>';
        if (e.message.includes('401') || e.message.includes('Incorrect API key')) {
          showToast('APIキーが無効です。設定を確認してください');
          document.getElementById('settingsPanel').classList.remove('hidden');
        } else if (e.message.includes('429')) {
          showToast('利用制限に達しました。しばらく待ってから再試行してください');
        } else {
          showToast(e.message);
        }
      }
    }

    function renderResult(data) {
      const todo    = data.todo;
      const message = data.message;

      // DOMを作成してinnerHTMLの連結を最小化
      const container = document.getElementById('todoContent');
      container.innerHTML = '';

      if (todo.deadline) {
        container.insertAdjacentHTML('beforeend', `
          <div class="flex items-start gap-2.5">
            <div class="w-6 h-6 bg-red-100 rounded-lg flex items-center justify-center flex-shrink-0 mt-0.5">
              <i data-lucide="clock" class="text-red-500" style="width:13px;height:13px"></i>
            </div>
            <div>
              <span class="text-xs text-gray-500 block">期限</span>
              <span class="text-base font-bold text-red-600">${escapeHtml(todo.deadline)}</span>
            </div>
          </div>`);
      }

      if (Array.isArray(todo.targets) && todo.targets.length > 0) {
        const tagHtml = todo.targets
          .map(t => `<span class="bg-orange-100 text-orange-700 text-sm font-medium px-2.5 py-1 rounded-full">${escapeHtml(t)}</span>`)
          .join('');
        container.insertAdjacentHTML('beforeend', `
          <div class="flex items-start gap-2.5">
            <div class="w-6 h-6 bg-orange-100 rounded-lg flex items-center justify-center flex-shrink-0 mt-0.5">
              <i data-lucide="users" class="text-orange-500" style="width:13px;height:13px"></i>
            </div>
            <div>
              <span class="text-xs text-gray-500 block mb-1.5">対象者</span>
              <div class="flex flex-wrap gap-1.5">${tagHtml}</div>
            </div>
          </div>`);
      }

      if (Array.isArray(todo.actions) && todo.actions.length > 0) {
        const actionsHtml = todo.actions.map(a => `
          <div class="flex items-center gap-2 py-2 border-b border-orange-100 last:border-0">
            <div class="w-5 h-5 bg-white rounded-md border-2 border-orange-300 flex-shrink-0" role="checkbox" aria-checked="false"></div>
            <div class="flex-1 min-w-0">
              <span class="text-sm font-semibold text-gray-800">${escapeHtml(a.label ?? '')}</span>
              ${a.person ? `<span class="text-xs text-gray-500 ml-1.5">${escapeHtml(a.person)}</span>` : ''}
            </div>
            ${a.time ? `<span class="text-xs font-bold text-orange-600 bg-orange-50 px-2 py-0.5 rounded-lg flex-shrink-0">${escapeHtml(a.time)}</span>` : ''}
          </div>`).join('');
        container.insertAdjacentHTML('beforeend', `
          <div class="flex items-start gap-2.5">
            <div class="w-6 h-6 bg-yellow-100 rounded-lg flex items-center justify-center flex-shrink-0 mt-0.5">
              <i data-lucide="list-checks" class="text-yellow-600" style="width:13px;height:13px"></i>
            </div>
            <div class="flex-1 min-w-0">
              <span class="text-xs text-gray-500 block mb-1">実施内容</span>
              <div>${actionsHtml}</div>
            </div>
          </div>`);
      }

      document.getElementById('messageContent').textContent = message;
      generatedTodo    = buildTodoText(todo);
      generatedMessage = message;

      document.getElementById('loadingArea').classList.add('hidden');
      document.getElementById('resultArea').classList.remove('hidden');
      setLoading(false, false);
      lucide.createIcons();
      setTimeout(() => {
        document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 50);
    }

    function buildTodoText(todo) {
      let t = '【本日中の重要ToDo】\n';
      if (todo.deadline) t += `期限：${todo.deadline}\n`;
      if (Array.isArray(todo.targets) && todo.targets.length > 0)
        t += `対象者：${todo.targets.join('、')}\n`;
      if (Array.isArray(todo.actions) && todo.actions.length > 0) {
        t += '\n【実施内容】\n';
        todo.actions.forEach((a, i) => {
          t += `${i + 1}. ${a.label ?? ''}`;
          if (a.person) t += `（${a.person}）`;
          if (a.time)   t += ` → ${a.time}`;
          t += '\n';
        });
      }
      return t.trim();
    }

    function copyText(type) {
      const text = type === 'todo'    ? generatedTodo
                 : type === 'message' ? generatedMessage
                 : generatedTodo + '\n\n' + generatedMessage;
      const labels = {
        todo:    'ToDoをコピーしました',
        message: '完成文をコピーしました',
        all:     'ToDo＋完成文をコピーしました',
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
          .then(() => showToast(labels[type]))
          .catch(() => fallbackCopy(text, labels[type]));
      } else {
        fallbackCopy(text, labels[type]);
      }
    }

    function fallbackCopy(text, toastMsg) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { document.execCommand('copy'); showToast(toastMsg); }
      catch { showToast('コピーに失敗しました。手動でコピーしてください'); }
      document.body.removeChild(ta);
    }

    function setLoading(on, showSkeleton = true) {
      const btn   = document.getElementById('generateBtn');
      const label = document.getElementById('btnLabel');
      btn.disabled = on;
      label.textContent = on ? '生成中...' : '生成する';
      if (on && showSkeleton) {
        document.getElementById('loadingArea').classList.remove('hidden');
        document.getElementById('resultArea').classList.add('hidden');
      }
      if (!on) {
        document.getElementById('loadingArea').classList.add('hidden');
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('copyToast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function shareToLine(type) {
      const text = type === 'todo'    ? generatedTodo
                 : type === 'message' ? generatedMessage
                 : generatedTodo + '\n\n' + generatedMessage;
      const url = 'https://line.me/R/share?text=' + encodeURIComponent(text);
      window.open(url, '_blank');
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
